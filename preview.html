
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.exe - For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #32102f, #100817 65%, #030208);
    font-family: Consolas, monospace;
    color: #ffb6df;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#matrix {
    z-index: 0;
    opacity: .4;
}

#fireworks {
    z-index: 1;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 550px;
    padding: 30px 22px;
    text-align: center;
    background: rgba(40, 5, 35, .78);
    border: 1px solid #ff69b4;
    border-radius: 22px;
    box-shadow: 0 0 35px #ff149366;
    backdrop-filter: blur(10px);
}

h2 {
    color: #ff8ac7;
    margin-bottom: 25px;
    text-shadow: 0 0 15px #ff1493;
}

#loading {
    text-align: left;
    color: #ff9bd2;
    font-size: 13px;
    line-height: 2;
    min-height: 230px;
}

.load-line {
    opacity: 0;
    animation: showLine .5s forwards;
    text-shadow: 0 0 8px #ff1493;
}

@keyframes showLine {
    to { opacity: 1; }
}

.progress {
    width: 100%;
    height: 8px;
    background: #38152f;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ff1493, #ffb6e6);
    box-shadow: 0 0 15px #ff1493;
    transition: width .7s ease;
}

#loadingStatus {
    color: #ffb6df;
    margin-top: 8px;
    font-size: 12px;
}

#heartSection {
    display: none;
    animation: zoom 1s ease;
}

.heart {
    font-size: 105px;
    cursor: pointer;
    display: inline-block;
    margin: 20px;
    animation: beat 1s infinite;
    filter: drop-shadow(0 0 20px #ff1493);
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

.hint {
    margin-top: 5px;
    color: #ffc4e4;
    font-size: 14px;
}

#message {
    display: none;
    margin-top: 25px;
    color: #ff8ac7;
    font-size: clamp(25px, 6vw, 39px);
    font-weight: bold;
    line-height: 1.5;
    text-shadow: 0 0 10px #ff1493, 0 0 30px #ff69b4;
    animation: zoom 1s ease;
}

#sub {
    display: none;
    color: #ffe0f2;
    margin-top: 15px;
    font-size: 14px;
    animation: zoom 1.5s ease;
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(.2);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>
<canvas id="fireworks"></canvas>

<div class="container">

    <h2>&lt; LOVE.exe /&gt; 💗</h2>

    <!-- LOADING -->
    <div id="loading">

        <div id="codeLines"></div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div id="loadingStatus">
            INITIALIZING... 0%
        </div>

    </div>

    <!-- TRÁI TIM -->
    <div id="heartSection">

        <p>> LOVE DECODED SUCCESSFULLY ❤️</p>

        <div class="heart" id="heart" onclick="openLove()">
            💗
        </div>

        <p class="hint">
            Chạm vào trái tim để mở bí mật nhé 💕
        </p>

        <div id="message">
            BÀ CHÃ HƠM IU ĂM CHÃ HÚ 💗
        </div>

        <div id="sub">
            > ERROR 404: Không tìm thấy ai đáng yêu hơn em! ❤️
            <br><br>
            while (true) { I_LOVE_YOU(); }
        </div>

    </div>

</div>

<script>

// =================================
// 1. MATRIX 010101
// =================================

const mc = document.getElementById("matrix");
const mx = mc.getContext("2d");

let cols, drops;

function resizeMatrix() {
    mc.width = window.innerWidth;
    mc.height = window.innerHeight;

    cols = Math.floor(window.innerWidth / 18);
    drops = Array(cols).fill(1);
}

resizeMatrix();

window.addEventListener("resize", resizeMatrix);

function matrix() {

    mx.fillStyle = "rgba(10,0,15,0.12)";
    mx.fillRect(0, 0, mc.width, mc.height);

    mx.fillStyle = "#ff65bd";
    mx.font = "15px Consolas";

    drops.forEach((y, i) => {

        const text = Math.random() > .5 ? "1" : "0";

        mx.fillText(text, i * 18, y * 18);

        if (y * 18 > mc.height && Math.random() > .97) {
            drops[i] = 0;
        }

        drops[i]++;
    });

    requestAnimationFrame(matrix);
}

matrix();


// =================================
// 2. LOADING 10 DÒNG CODE
// =================================

const loadingLines = [

    "> Booting LOVE.exe...",

    "> Initializing romantic system...",

    "> Connecting to your heart...",

    "> Searching for someone special...",

    "> Searching result: FOUND ❤️",

    "> Loading 1000 reasons to love you...",

    "> Compiling happiness...",

    "> Checking girlfriend status: CUTE 💗",

    "> Installing hugs and kisses...",

    "> LOVE SYSTEM: READY ❤️"

];

let lineIndex = 0;

function runLoading() {

    if (lineIndex >= loadingLines.length) {

        document.getElementById("loadingStatus").innerText =
            "LOADING COMPLETE - 100% ❤️";

        setTimeout(() => {

            document.getElementById("loading").style.display = "none";

            document.getElementById("heartSection").style.display = "block";

        }, 1000);

        return;
    }

    const line = document.createElement("div");

    line.className = "load-line";

    line.textContent = loadingLines[lineIndex];

    document.getElementById("codeLines").appendChild(line);

    lineIndex++;

    document.getElementById("progressBar").style.width =
        (lineIndex * 10) + "%";

    document.getElementById("loadingStatus").innerText =
        "LOADING... " + (lineIndex * 10) + "%";

    setTimeout(runLoading, 800);
}

// TỰ ĐỘNG CHẠY KHI MỞ TRANG
runLoading();


// =================================
// 3. HỆ THỐNG PHÁO HOA
// =================================

const fc = document.getElementById("fireworks");
const fx = fc.getContext("2d");

let particles = [];

function resizeFireworks() {
    fc.width = window.innerWidth;
    fc.height = window.innerHeight;
}

resizeFireworks();

window.addEventListener("resize", resizeFireworks);


function explode(x, y) {

    const colors = [
        "#ff1493",
        "#ff69b4",
        "#ffb6e6",
        "#ffffff",
        "#d896ff",
        "#ffd1f0",
        "#ffdf80"
    ];

    for (let i = 0; i < 110; i++) {

        const angle = Math.random() * Math.PI * 2;

        const speed = 1.5 + Math.random() * 6;

        particles.push({

            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: 1,

            color: colors[
                Math.floor(Math.random() * colors.length)
            ],

            size: 1 + Math.random() * 3

        });

    }
}


function animateFireworks() {

    fx.clearRect(0, 0, fc.width, fc.height);

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .025;

        p.vx *= .99;
        p.vy *= .99;

        p.life -= .009;

        fx.globalAlpha = Math.max(0, p.life);

        fx.fillStyle = p.color;

        fx.shadowBlur = 15;
        fx.shadowColor = p.color;

        fx.beginPath();

        fx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        fx.fill();

    });

    fx.globalAlpha = 1;

    particles = particles.filter(p => p.life > 0);

    requestAnimationFrame(animateFireworks);
}

animateFireworks();


// =================================
// 4. BẮN TRÁI TIM VÀ PHÁO HOA
// =================================

let opened = false;

function openLove() {

    if (opened) return;

    opened = true;

    // Ẩn trái tim
    document.getElementById("heart").style.display = "none";

    document.querySelector(".hint").style.display = "none";

    // Hiện lời yêu thương
    document.getElementById("message").style.display = "block";

    document.getElementById("sub").style.display = "block";


    // BẮN PHÁO HOA 20 ĐỢT
    let count = 0;

    const fireworks = setInterval(() => {

        explode(

            window.innerWidth * (.15 + Math.random() * .7),

            window.innerHeight * (.15 + Math.random() * .55)

        );

        count++;

        if (count >= 20) {
            clearInterval(fireworks);
        }

    }, 350);


    // BẮN 150 TRÁI TIM
    for (let i = 0; i < 150; i++) {

        setTimeout(() => {

            const h = document.createElement("div");

            h.innerText = [
                "💗",
                "💕",
                "💖",
                "💘",
                "❤️"
            ][Math.floor(Math.random() * 5)];

            h.style.cssText = `
                position:fixed;
                z-index:5;
                left:50%;
                top:50%;
                pointer-events:none;
                font-size:${18 + Math.random() * 30}px;
                transition:transform 2s ease-out,opacity 2s;
            `;

            document.body.appendChild(h);

            requestAnimationFrame(() => {

                h.style.transform =
                    `translate(
                        ${(Math.random() - .5) * window.innerWidth * 1.5}px,
                        ${(Math.random() - .5) * window.innerHeight * 1.5}px
                    )
                    rotate(${Math.random() * 360}deg)
                    scale(1.5)`;

                h.style.opacity = "0";

            });

            setTimeout(() => h.remove(), 2100);

        }, i * 12);

    }

}

</script>

</body>
</html>
